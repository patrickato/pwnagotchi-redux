# Redux time discipline — drop-in loaded via /etc/chrony/conf.d.
#
# The Pi has no battery-backed RTC, and the lab is an RF-shielded Faraday cage
# with no internet, so the usual NTP pool can't be reached while working inside
# it. A plugged-in GPS is the reliable time source there: gpsd exports the fix
# time into a shared-memory segment, and chrony reads it as reference clock 0.
#
# This is additive to Debian's default pool config: with ethernet/internet the
# pool still disciplines the clock; with a GPS + gpsd running it syncs from GPS;
# inside the cage with neither, there is simply no source (unavoidable, no RTC).
# Harmless when no GPS is present — chrony just has one unused refclock.
#
# Requires gpsd running (see the gpsd image profile). Plug the GPS in and get a
# fix; `chronyc sources` then shows the GPS refclock.
refclock SHM 0 refid GPS precision 1e-1 offset 0.0 delay 0.2

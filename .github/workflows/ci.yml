name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile check
        run: python -m compileall redux
      - name: Tests
        run: pytest
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

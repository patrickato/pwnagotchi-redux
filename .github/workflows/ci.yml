name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      - name: Compile check
        run: python -m compileall redux
      - name: Tests
        # Write pytest's output to a file, then print it — rather than streaming
        # straight to the Actions step pipe. Streaming to that pipe made pytest
        # abort with exit code 2 (a broken-pipe/SIGPIPE-class failure: fast, no
        # test-level detail) on the runner; redirecting to a file is the fix.
        # Module invocation also keeps repository-local namespace packages
        # (including boot/) on sys.path under Python 3.11.
        run: |
          set +e
          python -m pytest -p no:cacheprovider > pytest-output.txt 2>&1
          rc=$?
          cat pytest-output.txt
          exit $rc
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      # shellcheck is preinstalled on the ubuntu-latest runner image.
      - name: Image stage lint + hardware-free checks
        run: bash image/ci.sh

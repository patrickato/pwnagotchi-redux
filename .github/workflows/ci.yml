name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      - name: Compile check
        run: python -m compileall redux
      - name: Tests
        run: |
          # Surface collection errors as GH annotations (the full log blob is
          # not always reachable). Collect first; if that fails, echo the errors
          # as ::error:: lines (visible via the checks API) and stop.
          if ! python -m pytest --co -q > /tmp/collect.txt 2>&1; then
            echo "::error::pytest collection failed (exit $?):"
            sed -n '1,80p' /tmp/collect.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
            cat /tmp/collect.txt
            exit 1
          fi
          pytest
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      # shellcheck is preinstalled on the ubuntu-latest runner image.
      - name: Image stage lint + hardware-free checks
        run: bash image/ci.sh

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      - name: Compile check
        run: python -m compileall redux
      - name: Tests
        run: |
          # Surface the real failure as GH annotations (the full log blob is not
          # always reachable from the review side). Capture the run, then echo
          # the summary/error lines as ::error:: so they show via the checks API.
          set +e
          python -m pytest -rA -p no:cacheprovider > /tmp/pytest.txt 2>&1
          rc=$?
          echo "pytest exit code: $rc"
          if [ "$rc" -ne 0 ]; then
            # last ~80 lines usually hold the summary / tracebacks / interruption
            tail -n 80 /tmp/pytest.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          cat /tmp/pytest.txt
          exit $rc
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      # shellcheck is preinstalled on the ubuntu-latest runner image.
      - name: Image stage lint + hardware-free checks
        run: bash image/ci.sh

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      - name: Compile check
        run: python -m compileall redux
      - name: Tests
        # -p no:cacheprovider: the cache plugin writing .pytest_cache in the
        # runner checkout made pytest exit 2 (an internal/plugin error, fast and
        # with no test-level detail). CI is a fresh checkout every run and needs
        # no cross-run cache, so disabling it is both the fix and harmless here.
        run: pytest -p no:cacheprovider
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f"; done

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline release inspection tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc mtools e2fsprogs dosfstools squashfs-tools
      - name: Install
        run: pip install -e ".[dev,crypto]"
      # shellcheck is preinstalled on the ubuntu-latest runner image.
      - name: Image stage lint + hardware-free checks
        run: bash image/ci.sh

name: Gemini Autonomous Agent

on:
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  execute-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pytest

      - name: Run Gemini Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python .github/scripts/gemini_agent.py

      - name: Run Pytest (CI Check)
        run: pytest || echo "Tests failed, but proceeding to open PR for review."

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The Python script will output the branch name to a file
          BRANCH_NAME=$(cat .gemini_branch_name)
          git config user.name "Gemini Agent"
          git config user.email "gemini@actions.github.com"
          
          git checkout -b "$BRANCH_NAME"
          git add .
          git commit -m "feat: Implement task from TASKS.md"
          git push origin "$BRANCH_NAME"
          
          gh pr create --title "Gemini: Task Implementation" \
                       --body "Automated PR by Gemini Agent. Adheres to AGENTS.md rules. Please review CI and no-hardware tests." \
                       --head "$BRANCH_NAME" \
                       --base main

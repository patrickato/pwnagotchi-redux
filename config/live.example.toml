# Standalone Redux passive runtime; no active wireless operations.
[live]
state_dir = "/captures/redux"
capture_dir = "/captures/incoming"
active_dir = "/captures/active" # Bettercap writes here; never watched by converter
bettercap_binary = "bettercap"
preferred_iface = "" # Auto-select real monitor-capable radio. Example: wlan1mon
api_port = 8081
web_port = 8080
enable_web = true # Localhost only. Later UI may expose via an authenticated proxy.
retry_seconds = 10
probe_seconds = 30
rotation_seconds = 300 # Close each session and hand off its completed capture

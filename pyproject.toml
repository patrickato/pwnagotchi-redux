[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnagotchi-redux"
version = "0.0.1"
description = "Augur — standalone field-OS platform: lean image, bettercap-direct, Augur supervisor, Radio Orchestrator."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
redux = "redux.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]
# At-rest encryption (redux.vault). Optional on purpose: the core stays
# dependency-free, and the vault reports itself unavailable (honest, fail-closed)
# rather than storing plaintext when this isn't installed.
crypto = ["cryptography>=42"]

[tool.setuptools.packages.find]
include = ["redux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

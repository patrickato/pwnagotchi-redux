[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pwnagotchi-redux"
version = "0.0.1"
description = "Standalone field-OS platform: lean image, bettercap-direct, Beastcore supervisor, Radio Orchestrator."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["redux*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
